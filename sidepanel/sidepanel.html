<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Overview</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="sidepanel-shell">
    <div class="sticky-top-box">
      <h2 class="eyebrow">Articles overview</h2>
      <div id="unauthenticatedStatus" class="panel-status hidden">Not authenticated - please log in to the backend.</div>

      <div class="tabs" role="tablist" aria-label="Article overview tabs">
        <button class="tab-button active" type="button" role="tab" aria-selected="true" aria-controls="tab-overview" data-tab="overview">
          STA and Published
        </button>
        <button class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="tab-nacrtovani" data-tab="nacrtovani">
          Ready to publish
        </button>
      </div>
    </div>
    <section class="overview-card">
      <section id="tab-overview" class="tab-panel active" role="tabpanel">
        <div class="sta-search">
          <input
            id="overviewSearchInput"
            class="sta-search-input"
            type="search"
            placeholder="Search"
            aria-label="Search overview articles"
          >
        </div>
        <div id="overviewSourceFilters" class="published-filters" role="group" aria-label="Filter by source type"></div>
        <div id="publishedEditorialFiltersBlock">
          <div id="publishedFilters" class="published-filters editorials-filters" role="group" aria-label="Filter published articles by editorials"></div>
        </div>
        <div id="overviewStatus" class="panel-status">Loading...</div>
        <div id="overviewList" class="article-list"></div>
      </section>

      <section id="tab-nacrtovani" class="tab-panel" role="tabpanel" hidden>
        <div class="sta-search">
          <input
            id="readyToPublishSearchInput"
            class="sta-search-input"
            type="search"
            placeholder="Search"
            aria-label="Search ready to publish articles"
          >
        </div>
        <div id="readyToPublishFilters" class="published-filters editorials-filters" role="group" aria-label="Filter ready to publish by editorials"></div>
        <div id="readyToPublishStatus" class="panel-status">Loading...</div>
        <div id="readyToPublishList" class="article-list"></div>
      </section>
    </section>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
